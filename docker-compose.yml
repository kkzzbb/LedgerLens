# Local services for LedgerLens: PostgreSQL, the backend API (8000),
# DemoBank (8100), the frontend (5173, the Vite dev server) and otel-lgtm
# (Grafana on 3000, OTLP on 4317/4318), which collects and stores the
# traces, metrics and logs of the backend and DemoBank. Start everything with:
#   docker compose up --build
# or only the database with:
#   docker compose up -d db
# The credentials are demo values, the same as DATABASE_URL in .env.example.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledgerlens
      POSTGRES_PASSWORD: ledgerlens
      POSTGRES_DB: ledgerlens
    ports:
      - "5432:5432"
    volumes:
      - ledgerlens-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ledgerlens", "-d", "ledgerlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      # Started, not healthy: a slow Grafana start never blocks the app.
      otel-lgtm:
        condition: service_started
    healthcheck:
      # The slim image has no curl. Succeeds only on a 200.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              status = urllib.request.urlopen("http://localhost:8000/api/health", timeout=4).status
          except Exception:
              sys.exit(1)
          sys.exit(0 if status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  demobank:
    build: ./demobank
    env_file: .env
    ports:
      - "8100:8100"
    depends_on:
      db:
        condition: service_healthy
      otel-lgtm:
        condition: service_started
    healthcheck:
      # The slim image has no curl. Succeeds only on a 200.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              status = urllib.request.urlopen("http://localhost:8100/health", timeout=4).status
          except Exception:
              sys.exit(1)
          sys.exit(0 if status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build: ./frontend
    # No env_file: .env sets API_PROXY_TARGET for a dev server on the host.
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  # OpenTelemetry Collector, Prometheus, Loki, Tempo and Grafana in one
  # container (anonymous Grafana access, the image's default). No volume:
  # the telemetry is lost on `docker compose down`. The alert rule
  # "LedgerLens sync failing" is provisioned from the mounted file.
  otel-lgtm:
    image: grafana/otel-lgtm:0.37.0
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/grafana/provisioning/alerting/ledgerlens-sync.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/ledgerlens-sync.yaml:ro

volumes:
  ledgerlens-db:

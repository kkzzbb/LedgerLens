name: CI

# Runs every check on each pull request and on each push to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.project }} (lint, typecheck, unit + integration tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [backend, demobank]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgerlens
          POSTGRES_PASSWORD: ledgerlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The integration (db) tests run against the service above.
      TEST_DATABASE_URL: postgresql://ledgerlens:ledgerlens@localhost:5432/postgres
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    name: frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
